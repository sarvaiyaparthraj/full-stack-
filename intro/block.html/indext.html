<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>block tags</title>
  </head>
  <body>
    <h1>heading 1</h1>
    <h2>heading2</h2>
    <h3>heading3</h3>
    <h4>heading4</h4>
    <h5>heading5</h5>
    <h6>heading6</h6>

    <p>this is paragraph</p>

    <hr />
    <p>
      this is <br />
      paragraph
    </p>

    <!-- order types -->

    <ol type="A">
      <li>list-1</li>
      <li>list-2</li>
      <li>list-3</li>
    </ol>

    <!-- un order list -->
    <ul>
      <li>list-1</li>
      <li>list-2</li>
      <li>list-3</li>
    </ul>

    <!-- detail list -->

    <dl>
      <dt>fruits</dt>
      <dd>apples</dd>
      <dd>banana</dd>
      <dd>mango</dd>
    </dl>
  </body>
</html>
